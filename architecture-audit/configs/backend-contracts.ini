; Contratos Import Linter — WEB_MINERA Backend (FastAPI / hexagonal)
; Estructura real inspeccionada bajo backend/app/:
;   domain, application, ports, adapters, infrastructure, composition
; No se inventan capas ausentes. include_external_packages permite vetar FastAPI/etc.

[importlinter]
root_packages =
    app
include_external_packages = True

; ---------------------------------------------------------------------------
; Dominio: núcleo puro — sin frameworks, persistencia ni capas externas
; ---------------------------------------------------------------------------
[importlinter:contract:domain-independence]
name = Domain independence (no frameworks / outer layers)
type = forbidden
source_modules =
    app.domain
forbidden_modules =
    app.adapters
    app.application
    app.composition
    app.infrastructure
    app.ports
    fastapi
    uvicorn
    starlette
    httpx
    supabase
    sqlalchemy
    pydantic
    pydantic_settings

; ---------------------------------------------------------------------------
; Aplicación: orquesta dominio + puertos — sin adaptadores ni HTTP stack
; (pydantic en DTO de application está permitido a propósito; no se veta aquí)
; ---------------------------------------------------------------------------
[importlinter:contract:application-independence]
name = Application independence (no adapters / HTTP / Supabase)
type = forbidden
source_modules =
    app.application
forbidden_modules =
    app.adapters
    app.composition
    fastapi
    uvicorn
    starlette
    httpx
    supabase
    sqlalchemy

; ---------------------------------------------------------------------------
; Puertos: contratos — sin implementaciones concretas ni frameworks
; ---------------------------------------------------------------------------
[importlinter:contract:ports-independence]
name = Ports independence (no adapters / infra / frameworks)
type = forbidden
source_modules =
    app.ports
forbidden_modules =
    app.adapters
    app.composition
    app.infrastructure
    fastapi
    uvicorn
    starlette
    httpx
    supabase
    sqlalchemy

; ---------------------------------------------------------------------------
; Dirección de capas (alta → baja).
; Composition (root) > adapters > infrastructure > application > ports > domain
; Adapters pueden usar settings/logging de infrastructure.
; Si adapters importa composition, Import Linter lo reportará (no se ignora).
; ---------------------------------------------------------------------------
[importlinter:contract:hexagonal-layers]
name = Hexagonal layer direction
type = layers
layers =
    app.composition
    app.adapters
    app.infrastructure
    app.application
    app.ports
    app.domain

; Los ciclos se detectan con grimp en run_architecture_audit.py (no se usa
; contract independence sobre subpaquetes de domain: entities→value_objects es legítimo).
