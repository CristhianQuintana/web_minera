name: ml-ci

on:
  push:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  test:
    name: Pruebas de ML (suspendidas temporalmente)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Avisar que la instalación y las pruebas ML están suspendidas
        run: echo "::notice::La instalación de dependencias y las pruebas automatizadas de ML están temporalmente suspendidas y pendientes de corrección del hash SHA256."
