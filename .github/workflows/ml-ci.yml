name: ml-ci
on:
  push:
    paths: ["ml/**"]
  pull_request:
    paths: ["ml/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --require-hashes -r requirements.hashed.txt
      - run: pytest
