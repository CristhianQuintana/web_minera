name: backend-ci

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --require-hashes -r requirements/dev.hashed.txt

      - name: Análisis estático con Ruff
        run: ruff check app tests

      - name: Ejecutar pruebas backend
        run: pytest