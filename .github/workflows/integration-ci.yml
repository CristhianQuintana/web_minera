name: integration-ci

on:
  push:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  backend-unit-tests:
    name: Pruebas unitarias backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias backend
        run: pip install --require-hashes -r backend/requirements/dev.hashed.txt

      - name: Ejecutar pruebas unitarias backend
        run: pytest backend/tests/unit

  ml-tests:
    name: Pruebas de ML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias ML
        run: pip install --require-hashes -r ml/requirements.hashed.txt

      - name: Ejecutar pruebas ML
        run: pytest ml/tests
        env:
          PYTHONPATH: ml
