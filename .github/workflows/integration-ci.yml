name: integration-ci
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements/dev.txt
      - run: pytest backend/tests/unit
      - run: pip install -r ml/requirements.txt
      - run: pytest ml/tests
        env:
          PYTHONPATH: ml
