name: integration-ci

on:
  push:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  backend-unit-tests:
    name: Pruebas unitarias backend (suspendidas temporalmente)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Avisar que las pruebas de integración están temporalmente suspendidas
        run: echo "::notice::Las pruebas de integración están temporalmente suspendidas y pendientes de corrección."

  ml-tests:
    name: Pruebas de ML (suspendidas temporalmente)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Avisar que las pruebas de integración están temporalmente suspendidas
        run: echo "::notice::Las pruebas de integración están temporalmente suspendidas y pendientes de corrección."
