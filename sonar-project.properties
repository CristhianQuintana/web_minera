sonar.projectKey=web_minera
sonar.projectName=WEB_MINERA

sonar.exclusions=**/node_modules/**,**/coverage/**,**/.next/**,**/dist/**,**/.venv/**,**/architecture-audit/tests/fixtures/**

# Migraciones/seeds SQL: literales repetidos (roles RLS, 'authenticated', org checks)
# son inherentes al DDL histórico de Postgres/Supabase. No existe mecanismo portable
# de "constantes" en SQL de migraciones sin reescribir políticas RLS.
# css:S4662 — @theme es at-rule válida de Tailwind CSS v4 (no CSS estándar legacy).
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5

sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/database/**/*

sonar.issue.ignore.multicriteria.e2.ruleKey=tsql:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=**/database/**/*

sonar.issue.ignore.multicriteria.e3.ruleKey=sql:S1192
sonar.issue.ignore.multicriteria.e3.resourceKey=**/database/**/*

sonar.issue.ignore.multicriteria.e4.ruleKey=postgresql:S1192
sonar.issue.ignore.multicriteria.e4.resourceKey=**/database/**/*

sonar.issue.ignore.multicriteria.e5.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.e5.resourceKey=**/frontend/src/app/globals.css
